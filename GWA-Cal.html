    <div class="container_Gwa">
        <div class="header">
            <h1>Student Grade Calculator</h1>
        </div>
            <label for="Fname">First Name:</label>
            <input type="text" id="Fname" placeholder="Enter First Name"> <br>

            <label for="Lname">Last Name:</label>
            <input type="text" id="Lname" placeholder="Enter Last Name"> <br>

            <label for="G_S">Grade and Section:</label>
            <input type="text" id="G_S" placeholder="Enter Grade and Section"> <br>

            <h3>Enter Grades:</h3> 

            <label for="Math">Math:</label>
            <input type="number" id="Math" placeholder="Math Grade">

            <label for="Science">Science:</label>
            <input type="number" id="Science" placeholder="Science Grade"> <br>

            <label for="Fil">Filipino:</label>
            <input type="number" id="Fil" placeholder="Filipino Grade">

            <label for="Eng">English:</label>
            <input type="number" id="Eng" placeholder="English Grade"> <br>

            <label for="PE">PE:</label>
            <input type="number" id="PE" placeholder="PE Grade">

            <label for="ICT">ICT:</label>
            <input type="number" id="ICT" placeholder="ICT Grade"> <br> <br>

            <button py-click="calculate">Calculate GWA</button> <br>

            <div class="outputstyling">
            <div id="output" style="margin: 10px;"></div>  <br>
            </div> <br>
    </div>
